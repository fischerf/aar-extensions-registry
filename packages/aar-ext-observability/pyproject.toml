[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aar-ext-observability"
version = "0.1.0"
description = "Structured metrics and logging for each agent turn"
requires-python = ">=3.11"
dependencies = ["aar-agent"]
keywords = ["aar-extension"]
license = {text = "Apache-2.0"}

[project.entry-points."aar_extensions"]
observability = "aar_ext_observability:register"

[tool.hatch.build.targets.wheel]
packages = ["aar_ext_observability"]

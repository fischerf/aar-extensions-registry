[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "aar-ext-mcp-tools"
version = "0.1.0"
description = "Expose MCP server tools as native Aar tools via the extension API"
requires-python = ">=3.12.2"
dependencies = ["aar-agent", "mcp>=1.28.1,<2.0"]
keywords = ["aar-extension"]
license = {text = "Apache-2.0"}

[project.entry-points."aar_extensions"]
mcp_tools = "aar_ext_mcp_tools:register"

[tool.hatch.build.targets.wheel]
packages = ["aar_ext_mcp_tools"]
